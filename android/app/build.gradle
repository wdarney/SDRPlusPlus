apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 28
    buildToolsVersion "30.0.3"
    ndkVersion "25.1.8937393"
    defaultConfig {
        applicationId "org.sdrpp.sdrpp"
        minSdkVersion 28
        targetSdkVersion 28
        versionCode 1
        versionName "1.2.1"

        externalNativeBuild {
            cmake {
                arguments "-DOPT_BACKEND_GLFW=OFF", "-DOPT_BACKEND_ANDROID=ON", "-DOPT_BUILD_SOAPY_SOURCE=OFF", "-DOPT_BUILD_SDDC_SOURCE=OFF", "-DOPT_BUILD_RX888_SOURCE=ON", "-DOPT_BUILD_ANDROID_AUDIO_SINK=ON", "-DOPT_BUILD_AUDIO_SINK=OFF", "-DOPT_BUILD_DISCORD_PRESENCE=OFF", "-DOPT_BUILD_M17_DECODER=ON", "-DOPT_BUILD_PLUTOSDR_SOURCE=ON", "-DOPT_BUILD_AUDIO_SOURCE=OFF", "-DOPT_BUILD_HYDRASDR_SOURCE=OFF", "-DOPT_BUILD_CHANNEL_BANK=ON", "-DOPT_BUILD_VDL2_DECODER=OFF"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            version "3.18.1"
            path "../../CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['assets']
            jniLibs.srcDirs += ['jniLibs']
        }
    }

    // Some kit libs (e.g. libzstd.so) get bundled via more than one path
    // (CMake IMPORTED + our jniLibs copy). Take the first instance.
    packagingOptions {
        pickFirst '**/*.so'
    }
}

task deleteTempAssets (type: Delete) {
    delete 'assets'
}

task copyResources(type: Copy) {
    description = 'Copy resources...'
    from '../../root/'
    into 'assets/'
    include('**/*')
}

// Copy android-sdr-kit shared libraries into jniLibs so they get packaged
// into the APK and are loadable at runtime via dlopen.
task copyKitLibs(type: Copy) {
    description = 'Copy android-sdr-kit shared libraries into jniLibs/<ABI>/'
    ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
        from("/sdr-kit/${abi}/lib") {
            include '*.so'
            into abi
        }
    }
    into 'jniLibs'
}

def rx888OptimizedFftw = file('../../source_modules/rx888_source/android-prebuilt/arm64-v8a/libfftw3f.so')
def rx888OptimizedFftwSha256 = '2090834c7a41f71451de700e23176b1a91a3cc500819e7726d2ac0161cbf055d'

task verifyRx888OptimizedFftw {
    description = 'Verify the RX888 ARM64 NEON FFTW library'
    inputs.file rx888OptimizedFftw
    doLast {
        if (!rx888OptimizedFftw.exists()) {
            throw new GradleException("Missing optimized RX888 FFTW library: ${rx888OptimizedFftw}")
        }

        def bytes = rx888OptimizedFftw.bytes
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(bytes).encodeHex().toString()
        if (digest != rx888OptimizedFftwSha256) {
            throw new GradleException("Unexpected RX888 FFTW SHA-256: ${digest}")
        }

        def markers = new String(bytes, 'ISO-8859-1')
        if (markers.contains('NO_SIMD') || !markers.contains('fftw-3.3.10-neon')) {
            throw new GradleException('RX888 FFTW is not the expected ARM64 NEON build')
        }
    }
}

task copyRx888OptimizedFftw(type: Copy) {
    description = 'Overlay the optimized RX888 ARM64 FFTW library'
    dependsOn copyKitLibs
    dependsOn verifyRx888OptimizedFftw
    from rx888OptimizedFftw
    into 'jniLibs/arm64-v8a'
}

def verifyRx888FftwBytes = { byte[] bytes, String location ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(bytes).encodeHex().toString()
    if (digest != rx888OptimizedFftwSha256) {
        throw new GradleException("Unexpected RX888 FFTW SHA-256 in ${location}: ${digest}")
    }

    def markers = new String(bytes, 'ISO-8859-1')
    if (markers.contains('NO_SIMD') || !markers.contains('fftw-3.3.10-neon')) {
        throw new GradleException("RX888 FFTW in ${location} is not the expected ARM64 NEON build")
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        doLast {
            def apk = file("${buildDir}/outputs/apk/release/app-release.apk")
            if (!apk.exists()) {
                throw new GradleException("Missing release APK: ${apk}")
            }

            def zip = new java.util.zip.ZipFile(apk)
            try {
                def entry = zip.getEntry('lib/arm64-v8a/libfftw3f.so')
                if (entry == null) {
                    throw new GradleException('Release APK is missing ARM64 FFTW')
                }
                verifyRx888FftwBytes(zip.getInputStream(entry).bytes, apk.name)
            } finally {
                zip.close()
            }
        }
    }
}

task deleteJniLibs (type: Delete) {
    delete 'jniLibs'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.0.2'
}

copyResources.dependsOn deleteTempAssets
copyKitLibs.dependsOn deleteJniLibs
preBuild.dependsOn copyResources
preBuild.dependsOn copyRx888OptimizedFftw
